name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(node -p 'require("./manifest.json").version')" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          mkdir -p dist
          ZIP="dist/search-aggregator-v${{ steps.version.outputs.value }}.zip"
          zip -r "$ZIP" manifest.json src icons README.md -x '*.DS_Store'
          unzip -l "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-aggregator
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "搜索聚合 ${{ github.ref_name }}" \
            --generate-notes
