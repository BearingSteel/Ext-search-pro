<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 鼠标主体的渐变 -->
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EE7FF"/>
      <stop offset="50%" stop-color="#2DD4EF"/>
      <stop offset="100%" stop-color="#087C9E"/>
    </linearGradient>

    <!-- 鼠标左侧高光 -->
    <linearGradient id="mouseHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 放大镜镜片玻璃质感 -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#5EE7FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#087C9E" stop-opacity="0.6"/>
    </linearGradient>

    <!-- 投影阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 深色背景（如需透明可删除此rect） -->
  <rect width="512" height="512" fill="#15171A" rx="100"/>

  <!-- 1. 鼠标整体 -->
  <g filter="url(#shadow)">
    <path d="M 80 160 
             C 80 50, 300 50, 300 160 
             C 320 250, 310 380, 280 430 
             C 250 470, 130 470, 100 430 
             C 70 380, 60 250, 80 160 Z" 
          fill="url(#mouseBody)"/>
  </g>

  <!-- 鼠标左侧高光 -->
  <path d="M 100 160 C 100 80, 180 70, 200 100 C 150 150, 130 260, 150 400 C 110 380, 85 260, 100 160 Z" 
        fill="url(#mouseHighlight)" />

  <!-- 2. 左右键分割线（只画到滚轮上方，避免穿透） -->
  <path d="M 190 70 Q 190 100 190 120" 
        fill="none" stroke="#15171A" stroke-width="16" stroke-linecap="round" opacity="0.6"/>

  <!-- 3. 鼠标滚轮（不透明，完全遮盖下方） -->
  <rect x="166" y="100" width="48" height="90" rx="24" fill="#15171A" opacity="0.9"/>
  <!-- 滚轮高光/细节 -->
  <rect x="176" y="110" width="12" height="60" rx="6" fill="#FFFFFF" opacity="0.5"/>
  <line x1="176" y1="180" x2="204" y2="180" stroke="#2DD4EF" stroke-width="4" stroke-linecap="round"/>

  <!-- 4. 放大镜（干净的边缘，没有发光污染） -->
  <g>
    <!-- 放大镜手柄 -->
    <line x1="365" y1="295" x2="445" y2="375" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
    
    <!-- 放大镜外边框 -->
    <circle cx="310" cy="240" r="80" fill="#15171A" stroke="#FFFFFF" stroke-width="30"/>
    
    <!-- 镜片玻璃内部 -->
    <circle cx="310" cy="240" r="65" fill="url(#lensGlass)"/>
    
    <!-- 镜片反光（增加通透感） -->
    <path d="M 265 200 A 55 55 0 0 1 325 185 A 60 60 0 0 0 270 215 Z" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="285" cy="225" r="8" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
