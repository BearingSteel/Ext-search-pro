<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Aggregator</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="head">
        <img class="logo" src="../icons/icon48.png" alt="" width="44" height="44" />
        <div>
          <h1 data-i18n="extName">搜索聚合</h1>
          <p class="sub" data-i18n="optionsDesc">
            选中网页文字 → 右键 → 搜索聚合 → 选择引擎。下面的引擎按列表顺序出现在子菜单中。
          </p>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="enginesHeading">搜索引擎</h2>
          <button id="restore" class="ghost small" type="button" data-i18n="restore">
            恢复默认
          </button>
        </div>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" data-i18n="empty" hidden>
          列表是空的，添加一个搜索引擎吧。
        </p>
      </section>

      <section class="card">
        <div class="card-head">
          <h2 id="form-title" data-i18n="addHeading">添加搜索引擎</h2>
        </div>
        <form id="form" autocomplete="off">
          <label class="field">
            <span data-i18n="nameLabel">名称</span>
            <input
              id="name"
              type="text"
              maxlength="24"
              data-i18n-placeholder="namePlaceholder"
              required
            />
          </label>
          <label class="field">
            <span data-i18n="urlLabel">搜索地址</span>
            <input
              id="url"
              type="text"
              data-i18n-placeholder="urlPlaceholder"
              required
            />
          </label>
          <p class="hint" data-i18n="urlHint">用 %s 代表选中的文字。</p>
          <div class="form-actions">
            <button type="submit" id="submit" class="primary" data-i18n="addBtn">
              添加
            </button>
            <button type="button" id="cancel" class="ghost" data-i18n="cancelBtn" hidden>
              取消编辑
            </button>
            <span id="msg" class="msg" role="status"></span>
          </div>
        </form>
      </section>

      <p class="foot" data-i18n="footNote">
        提示：Chrome / Edge 的右键子菜单项不支持自定义图标，各网站图标显示在上面的列表中。
      </p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
